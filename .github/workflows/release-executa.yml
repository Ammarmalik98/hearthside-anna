# Builds the Kesiel Executa for every platform Anna needs and attaches the archives to a
# GitHub Release. Run it from the Actions tab ("Run workflow") or by pushing a tag like
# kesiel-v0.1.0. Then fetch the archives into executas/kesiel/dist/ with
# scripts/fetch_binaries.py and run `anna-app apps publish`.
name: Release Kesiel Executa binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must be kesiel-v + the version in executas/kesiel/executa.json)"
        required: true
        default: kesiel-v0.1.0
  push:
    tags: ["kesiel-v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,    platform: linux-x86_64 }   # critical: Anna's cloud agent runs on Linux
          - { runner: macos-14,        platform: darwin-arm64 }
          - { runner: macos-15-intel,  platform: darwin-x86_64 }
          - { runner: windows-latest,  platform: windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check the tag matches the tool version
        shell: bash
        env: { RELEASE_TAG: "${{ inputs.tag || github.ref_name }}" }
        run: python -c "import json,os; v=json.load(open('executas/kesiel/executa.json'))['version']; assert os.environ['RELEASE_TAG']=='kesiel-v'+v, (os.environ['RELEASE_TAG'], v)"
      - name: Protocol test (source)
        run: python scripts/test_protocol.py
      - name: Build
        run: |
          python -m pip install pyinstaller==6.*
          python scripts/build_binary.py --platform ${{ matrix.platform }}
      - name: Protocol test (built binary)
        shell: bash
        run: |
          exe="executas/kesiel/dist/${{ matrix.platform }}/bin/hearthside-kesiel"
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then exe="$exe.exe"; fi
          python scripts/test_protocol.py --binary "$exe"
      - uses: actions/upload-artifact@v4
        with:
          name: kesiel-${{ matrix.platform }}
          path: |
            executas/kesiel/dist/*.tar.gz
            executas/kesiel/dist/*.zip
            executas/kesiel/dist/*.sha256
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: kesiel-*, merge-multiple: true, path: release }
      - name: Attach all four platforms to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(find release -name '*.tar.gz' -o -name '*.zip' | wc -l)" -eq 4
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "${{ github.sha }}" --title "Kesiel $RELEASE_TAG" --notes "Kesiel Executa binaries for Hearthside (Linux x64, macOS arm64/x64, Windows x64)."
          gh release upload "$RELEASE_TAG" release/* --clobber

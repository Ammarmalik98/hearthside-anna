# Optional: rebuild Kesiel's Executa on GitHub and attach the archives to a Release.
# (You can also build locally: `python scripts/build_binary.py` — Go cross-compiles every
# platform from one machine, so this workflow needs only one Linux runner.)
# Place this file at .github/workflows/release-executa.yml in the repository.
name: Release Kesiel Executa binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must be kesiel-v + the version in executas/kesiel/executa.json)"
        required: true
        default: kesiel-v0.2.0
  push:
    tags: ["kesiel-v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22.x", cache: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check the tag matches the tool version
        env: { RELEASE_TAG: "${{ inputs.tag || github.ref_name }}" }
        run: python -c "import json,os; v=json.load(open('executas/kesiel/executa.json'))['version']; assert os.environ['RELEASE_TAG']=='kesiel-v'+v, (os.environ['RELEASE_TAG'], v)"
      - name: Build all platforms (static, CGO off)
        run: python scripts/build_binary.py
      - name: Protocol + archive tests (Linux build, exactly as shipped)
        run: |
          python scripts/test_protocol.py --archives
          mkdir -p /tmp/lx && tar xzf executas/kesiel/dist/*-linux-x86_64.tar.gz -C /tmp/lx
          python scripts/test_protocol.py --binary /tmp/lx/bin/hearthside-kesiel
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "${{ github.sha }}" --title "Kesiel $RELEASE_TAG" --notes "Kesiel Executa binaries for Hearthside (static Go builds)."
          gh release upload "$RELEASE_TAG" executas/kesiel/dist/* --clobber
